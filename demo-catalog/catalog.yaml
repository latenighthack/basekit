# Generated by basekit-catalog-ksp from @ViewModelSpec and @Destination declarations.
# Do not edit: change the Kotlin declarations instead.

schema: catalog/v1

screens:
  # ─────────────────────────────────────────────
  # Home
  # ─────────────────────────────────────────────

  Home:
    spec: com.latenighthack.basekit.catalogdemo.IHomeViewModel
    navigation:
      args: {}
      route: "/"
      route_args: []
      response: null

    state:
      greeting: String
      badge: Badge?
      photoState: PhotoState

    actions:
      onCreateRoom: { navigates_to: Room }
      onSettingsTapped: { navigates_to: Settings }

    lists:
      rooms:
        kind: sectioned
        sections: [Recent, Suggested]
        element: HomeListItem
        rows: [EmptyRoomsItem, RoomItem, TitleItem]

    children:
      avatar: Avatar

  # ─────────────────────────────────────────────
  # Picker
  # ─────────────────────────────────────────────

  Picker:
    spec: com.latenighthack.basekit.catalogdemo.IPickerViewModel
    navigation:
      args: {}
      route: null
      route_args: []
      response: PickResult

    state:
      title: String

    lists:
      options:
        kind: flat
        element: PickerOption
        rows: [PickerOption]

  # ─────────────────────────────────────────────
  # Room
  # ─────────────────────────────────────────────

  Room:
    spec: com.latenighthack.basekit.catalogdemo.IRoomViewModel
    navigation:
      args:
        roomId: String
        inviter: String?
      route: "/rooms/{roomId}"
      route_args: [roomId]
      response: null
    redirects_to: [Home]

    state:
      title: String
      role: RoomRole
      photo: ProfilePhoto
      query: String

    actions:
      onLeave: {}

    mutations:
      setQuery: { param: { query: String }, binds: query }
      onInvite: { param: { friendId: String }, navigates_to: Picker }

    children:
      avatar: Avatar

  # ─────────────────────────────────────────────
  # Settings
  # ─────────────────────────────────────────────

  Settings:
    spec: com.latenighthack.basekit.catalogdemo.ISettingsViewModel
    navigation:
      args: {}
      route: "/settings"
      route_args: []
      response: null
    redirects_to: [Room]

    state:
      version: String
      signOutButton: Button

    actions:
      onSignOut: {}

    children:
      profile: ProfileCard

components:
  # ─────────────────────────────────────────────
  # Shared components
  # ─────────────────────────────────────────────

  Avatar:
    spec: com.latenighthack.basekit.catalogdemo.IAvatarViewModel
    state:
      initials: String
    actions:
      onTapped: {}

  # ─────────────────────────────────────────────
  # Home components
  # ─────────────────────────────────────────────

  EmptyRoomsItem:
    spec: com.latenighthack.basekit.catalogdemo.IEmptyRoomsItemViewModel
    actions:
      onCreateRoomTapped: { navigates_to: Room }

  RoomItem:
    spec: com.latenighthack.basekit.catalogdemo.IRoomItemViewModel
    identity: key
    state:
      roomId: String
      title: String
    actions:
      onItemTapped: { navigates_to: Room }

  TitleItem:
    spec: com.latenighthack.basekit.catalogdemo.ITitleItemViewModel
    state:
      name: String
    actions:
      onItemTapped: { navigates_to: Picker }

  # ─────────────────────────────────────────────
  # Picker components
  # ─────────────────────────────────────────────

  PickerOption:
    spec: com.latenighthack.basekit.catalogdemo.IPickerOptionViewModel
    state:
      label: String
      pickedId: Int
    actions:
      onSelected: {}

  # ─────────────────────────────────────────────
  # Settings components
  # ─────────────────────────────────────────────

  ProfileCard:
    spec: com.latenighthack.basekit.catalogdemo.IProfileCardViewModel
    state:
      name: Text

  # ─────────────────────────────────────────────
  # Not embedded by any screen
  # ─────────────────────────────────────────────

  DebugPanel:
    spec: com.latenighthack.basekit.catalogdemo.IDebugPanelViewModel
    state:
      lastEvent: String?
      verbose: Boolean
    actions:
      onClear: {}
    mutations:
      setVerbose: { param: { verbose: Boolean }, binds: verbose }

types:
  Badge: { subtypes: [NEW, NONE], fields: { value: Int } }
  Button: { fields: { label: String, style: Button.Style } }
  Button.Style: { enum: [PRIMARY, SECONDARY] }
  PhotoState: { subtypes: [Idle, Uploaded] }
  PickResult: { fields: { pickedId: Int } }
  ProfilePhoto:
    fields:
      url: String?
      initials: String
  RoomRole: { enum: [HOST, GUEST] }
  Text: { fields: { value: String, style: Text.Style } }
  Text.Style: { enum: [BODY, TITLE] }
  Uploaded: { fields: { url: String } }
