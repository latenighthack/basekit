# Generated by basekit-catalog-ksp from @ViewModelSpec and @Destination declarations.
# Do not edit: change the Kotlin declarations instead.

schema: catalog/v1

screens:
  # ─────────────────────────────────────────────
  # Detail
  # ─────────────────────────────────────────────

  Detail:
    spec: com.latenighthack.basekit.demo.DetailViewModel
    navigation:
      args: { id: String }
      route: "/detail/{id}"
      route_args: [id]
      response: null

    state:
      id: String
      body: String
      count: Int
      note: String
      flagged: Boolean
      tags: List<String>

    actions:
      onIncrement: {}
      onReset: {}

    mutations:
      onSetNote: { param: { note: String } }
      onSetFlagged: { param: { flagged: Boolean } }

  # ─────────────────────────────────────────────
  # Home
  # ─────────────────────────────────────────────

  Home:
    spec: com.latenighthack.basekit.demo.HomeViewModel
    navigation:
      args: {}
      route: "/"
      route_args: []
      response: null

    state:
      title: String
      subtitle: String?

    actions:
      onRefresh: {}
      onOpenDetail: { navigates_to: Detail }
      onOpenDetailFromBanner: { navigates_to: Detail }
      onPick: { navigates_to: Picker }

    lists:
      items:
        kind: flat
        element: FeedItem
        rows: [FeedItem]

  # ─────────────────────────────────────────────
  # Picker
  # ─────────────────────────────────────────────

  Picker:
    spec: com.latenighthack.basekit.demo.PickerViewModel
    navigation:
      args: {}
      route: null
      route_args: []
      response: PickResult

    state:
      title: String

    lists:
      options:
        kind: flat
        element: PickerRow
        rows: [PickerOption, PickerEmpty]

components:
  # ─────────────────────────────────────────────
  # Home components
  # ─────────────────────────────────────────────

  FeedItem:
    spec: com.latenighthack.basekit.demo.FeedItemViewModel
    state:
      title: String
      subtitle: String
      id: String
    actions:
      onSelected: { navigates_to: Detail }

  # ─────────────────────────────────────────────
  # Picker components
  # ─────────────────────────────────────────────

  PickerEmpty:
    spec: com.latenighthack.basekit.demo.PickerEmptyViewModel
    state:
      message: String

  PickerOption:
    spec: com.latenighthack.basekit.demo.PickerOptionViewModel
    state:
      label: String
      id: Int
    actions:
      onSelected: {}

  # ─────────────────────────────────────────────
  # Not embedded by any screen
  # ─────────────────────────────────────────────

  BindingChild:
    spec: com.latenighthack.basekit.demo.BindingChildViewModel
    identity: identity
    state:
      title: String
    actions:
      select: {}

  BindingNote:
    spec: com.latenighthack.basekit.demo.BindingNoteViewModel
    state:
      text: String
    actions:
      dismiss: {}

  BindingProbe:
    spec: com.latenighthack.basekit.demo.BindingProbeViewModel
    identity: identity
    state:
      message: ProbeMessage
      optionalMessage: ProbeMessage?
      failure: ProbeFailure
      note: String?
      tags: List<String>
    actions:
      waitUntilCancelled: {}
      fail: {}
    mutations:
      setNote:
        param:
          value: String?
        binds: note
      setMessage: { param: { value: ProbeMessage }, binds: message }
      setFailure: { param: { value: ProbeFailure }, binds: failure }
      setTags: { param: { value: List<String> }, binds: tags }
    lists:
      rows:
        kind: flat
        element: BindingChild
        rows: [BindingChild]
      sections:
        kind: sectioned
        sections: [Group, Pinned]
        element: BindingChild
        rows: [BindingChild]
      shelves:
        kind: sectioned
        sections: [TOP, BOTTOM]
        element: BindingProbeRow
        rows: [BindingChild, BindingNote]
    children:
      child: BindingChild

types:
  PickResult: { fields: { selectedId: Int } }
  ProbeFailure: { enum: [NONE, RETRY] }
  ProbeMessage: { fields: { text: String } }
