<header>

<script type="application/json" id="catalog-data">__CATALOG_DATA__</script>
<script>
(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("catalog-data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const HEAD = 40, ROW = 22, LABEL = 20, PAD = 12, MIN_WIDTH = 170, GAP_X = 170, GAP_Y = 34;

  // ---------- helpers ----------
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };
  const svg = (tag, attrs = {}, ...children) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) if (value != null) node.setAttribute(key, value);
    for (const child of children) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    return node;
  };
  const measure = (() => {
    const context = document.createElement("canvas").getContext("2d");
    const style = getComputedStyle(document.documentElement);
    const sans = style.getPropertyValue("--font"), mono = style.getPropertyValue("--mono");
    return (text, font) => {
      context.font = font === "title" ? `600 13px ${sans}` : font === "mono" ? `12px ${mono}` : `11px ${sans}`;
      return context.measureText(text).width;
    };
  })();
  const eventText = (event) => event.kind === "redirect"
    ? `redirects → ${event.target}`
    : `${event.method}${event.kind === "mutation" ? "(…)" : "()"} → ${event.target}`;

  // ---------- graph model ----------
  const nodes = data.nodes.map((source) => ({ ...source, rows: [], incoming: [] }));
  const byName = new Map(nodes.map((node) => [node.name, node]));
  const events = [];
  for (const node of nodes) {
    let y = HEAD;
    let width = Math.max(measure(node.name, "title") + 2 * PAD + 20, MIN_WIDTH);
    if (node.route) width = Math.max(width, measure(node.route, "label") + 2 * PAD);
    for (const item of node.items) {
      if (!item.self) {
        node.rows.push({ type: "label", text: item.vm, y });
        width = Math.max(width, measure(item.vm, "label") + 2 * PAD);
        y += LABEL;
      }
      for (const event of item.events) {
        const row = { type: "event", event, item, y };
        node.rows.push(row);
        const edge = { ...event, node, row, item, target: byName.get(event.target) };
        row.edge = edge;
        events.push(edge);
        width = Math.max(width, measure(eventText(event), "mono") + 2 * PAD + 14);
        y += ROW;
      }
    }
    if (!node.rows.some((row) => row.type === "event")) {
      node.rows.push({ type: "empty", y });
      y += ROW;
    }
    node.width = Math.ceil(width);
    node.height = y + 8;
  }
  for (const edge of events) if (edge.target) edge.target.incoming.push(edge);
  // In a larger graph, edges into a screen many events open are drawn as short "→ Name" stubs; the full
  // line shows on hover, or for every edge with "All edges".
  const HUB_INCOMING = 6, HUB_MIN_NODES = 12;
  const hubs = new Set(nodes.length >= HUB_MIN_NODES ? nodes.filter((node) => node.incoming.length >= HUB_INCOMING) : []);
  for (const edge of events) edge.stub = hubs.has(edge.target);
  const totalEvents = events.length;
  document.getElementById("stats").textContent =
    `${data.nodes.filter((n) => n.screen).length} screens · ${totalEvents} events`;

  // ---------- layout: layered, left to right ----------
  const successors = new Map(nodes.map((node) => [node, [...new Set(events.filter((e) => e.node === node && e.target).map((e) => e.target))]]));
  const indegree = new Map(nodes.map((node) => [node, 0]));
  for (const [, targets] of successors) for (const target of targets) indegree.set(target, indegree.get(target) + 1);
  // Columns by tap distance: breadth-first from the entry screen (route "/"), so a screen sits one
  // column right of the nearest screen that opens it. Edges that point left or stay within a column
  // route around the boxes.
  const layer = new Map(), order = [];
  const spread = (starts) => {
    const queue = [...starts];
    while (queue.length) {
      const node = queue.shift();
      order.push(node);
      for (const next of successors.get(node)) {
        if (layer.has(next)) continue;
        layer.set(next, layer.get(node) + 1);
        queue.push(next);
      }
    }
  };
  const entries = nodes.filter((node) => node.route === "/");
  const starts = entries.length ? entries : nodes.filter((node) => indegree.get(node) === 0);
  const first = starts.length ? starts : nodes.slice(0, 1);
  for (const node of first) layer.set(node, 0);
  spread(first);
  // Screens the entry doesn't reach (deep links, separate flows, unembedded components) sit one column
  // left of the nearest screen they open, or start from column 0 when they open none that is placed.
  for (let unplaced = nodes.filter((node) => !layer.has(node)); unplaced.length; unplaced = nodes.filter((node) => !layer.has(node))) {
    const anchored = unplaced.filter((node) => successors.get(node).some((next) => layer.has(next)));
    const picked = anchored.length ? anchored : [unplaced[0]];
    for (const node of picked) {
      const placed = successors.get(node).filter((next) => layer.has(next)).map((next) => layer.get(next));
      layer.set(node, placed.length ? Math.min(...placed) - 1 : 0);
    }
    spread(picked);
  }
  const lowest = Math.min(...layer.values());
  for (const node of nodes) layer.set(node, layer.get(node) - lowest);
  const forward = (from, to) => layer.get(to) > layer.get(from);

  const layerCount = Math.max(0, ...layer.values()) + 1;
  const layers = Array.from({ length: layerCount }, () => []);
  for (const node of order) layers[layer.get(node)].push(node);
  const predecessors = new Map(nodes.map((node) => [node, []]));
  for (const node of nodes) for (const next of successors.get(node)) if (forward(node, next)) predecessors.get(next).push(node);

  // Barycenter passes reduce crossings.
  const position = new Map();
  const index = () => layers.forEach((nodesInLayer) => nodesInLayer.forEach((node, i) => position.set(node, i)));
  index();
  const sweep = (neighbours, order) => {
    for (const nodesInLayer of order) {
      const weight = new Map(nodesInLayer.map((node) => {
        const linked = neighbours(node).filter((other) => position.has(other));
        return [node, linked.length ? linked.reduce((sum, other) => sum + position.get(other), 0) / linked.length : position.get(node)];
      }));
      nodesInLayer.sort((a, b) => weight.get(a) - weight.get(b));
      nodesInLayer.forEach((node, i) => position.set(node, i));
    }
  };
  const successorsForward = (node) => successors.get(node).filter((next) => forward(node, next));
  for (let pass = 0; pass < 12; pass++) {
    sweep((node) => predecessors.get(node), layers.slice(1));
    sweep(successorsForward, layers.slice(0, -1).reverse());
  }

  const columns = [];
  let x = 0;
  for (const nodesInLayer of layers) {
    const columnWidth = Math.max(0, ...nodesInLayer.map((node) => node.width));
    const columnHeight = nodesInLayer.reduce((sum, node) => sum + node.height, 0) + GAP_Y * Math.max(0, nodesInLayer.length - 1);
    let y = -columnHeight / 2;
    for (const node of nodesInLayer) {
      node.x = x + (columnWidth - node.width) / 2;
      node.y = y;
      y += node.height + GAP_Y;
    }
    columns.push({ x, width: columnWidth, nodes: nodesInLayer });
    x += columnWidth + GAP_X;
  }

  // A forward edge that skips columns passes each column in between through a gap between boxes.
  const crossings = new Map();
  function passThrough(column, wantedY) {
    const used = crossings.get(column) || 0;
    crossings.set(column, used + 1);
    const obstacles = column.nodes.map((node) => [node.y - 14, node.y + node.height + 14]);
    let y = wantedY;
    const blocking = obstacles.find(([top, bottom]) => y > top && y < bottom);
    if (blocking) {
      const [top, bottom] = blocking;
      y = (y - top < bottom - y) ? top - (used % 4) * 7 : bottom + (used % 4) * 7;
    }
    return y;
  }

  // Incoming edges share the target's left side, ordered by where they come from.
  for (const node of nodes) {
    node.incoming.sort((a, b) => (a.node.y + a.row.y) - (b.node.y + b.row.y) || a.node.x - b.node.x);
    const top = 14, span = Math.max(node.height - 2 * top, 1);
    node.incoming.forEach((edge, i) => { edge.entryY = node.y + top + span * (i + 0.5) / node.incoming.length; });
  }

  // ---------- drawing ----------
  const canvas = document.getElementById("canvas");
  if (!nodes.length) {
    document.getElementById("empty").hidden = false;
    return;
  }
  const root = svg("svg");
  const defs = svg("defs");
  for (const [id, color] of [["arrow", "var(--edge)"], ["arrow-mutation", "var(--mutation)"], ["arrow-redirect", "var(--redirect)"], ["arrow-hl", "var(--accent)"]]) {
    defs.append(svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
      svg("path", { d: "M0,0 L10,5 L0,10 z", fill: color })));
  }
  root.append(defs);
  const viewport = svg("g");
  const edgeLayer = svg("g"), nodeLayer = svg("g"), stubLayer = svg("g");
  const fullGroup = svg("g");
  fullGroup.append(edgeLayer, nodeLayer, stubLayer);
  viewport.append(fullGroup);
  root.append(viewport);
  canvas.append(root);

  const rounded = (points, radius = 12) => {
    let d = `M${points[0][0]},${points[0][1]}`;
    for (let i = 1; i < points.length - 1; i++) {
      const [px, py] = points[i - 1], [cx, cy] = points[i], [nx, ny] = points[i + 1];
      const r = Math.min(radius, Math.hypot(cx - px, cy - py) / 2, Math.hypot(nx - cx, ny - cy) / 2);
      const ax = cx + (Math.sign(px - cx) * r), ay = cy + (Math.sign(py - cy) * r);
      const bx = cx + (Math.sign(nx - cx) * r), by = cy + (Math.sign(ny - cy) * r);
      d += ` L${ax},${ay} Q${cx},${cy} ${bx},${by}`;
    }
    const last = points[points.length - 1];
    return d + ` L${last[0]},${last[1]}`;
  };

  let detour = 0;
  for (const edge of events) {
    if (!edge.target) continue;
    const x1 = edge.node.x + edge.node.width, y1 = edge.node.y + edge.row.y + ROW / 2;
    const x2 = edge.target.x, y2 = edge.entryY;
    let d;
    const from = layer.get(edge.node), to = layer.get(edge.target);
    if (x2 > x1 + 30) {
      // Waypoints at both sides of every column the edge crosses, joined by horizontal-tangent curves.
      const points = [[x1, y1]];
      for (let l = from + 1; l < to; l++) {
        const column = columns[l];
        const t = (column.x + column.width / 2 - x1) / (x2 - x1);
        const y = passThrough(column, y1 + (y2 - y1) * t);
        points.push([column.x - 10, y], [column.x + column.width + 10, y]);
      }
      points.push([x2, y2]);
      d = `M${x1},${y1}`;
      for (let i = 1; i < points.length; i++) {
        const [px, py] = points[i - 1], [qx, qy] = points[i];
        if (py === qy && i % 2 === 0 && i < points.length - 1) { d += ` L${qx},${qy}`; continue; }
        const dx = Math.max(30, (qx - px) / 2);
        d += ` C${px + dx},${py} ${qx - dx},${qy} ${qx},${qy}`;
      }
    } else {
      // Back edges, self edges and edges within a column run below every box in the columns they span.
      const low = Math.min(from, to), high = Math.max(from, to);
      const spanned = columns.slice(low, high + 1).flatMap((column) => column.nodes);
      const below = Math.max(...spanned.map((node) => node.y + node.height)) + 22 + (detour++ % 8) * 9;
      d = rounded([[x1, y1], [x1 + 26 + (detour % 4) * 6, y1], [x1 + 26 + (detour % 4) * 6, below], [x2 - 26, below], [x2 - 26, y2], [x2, y2]]);
    }
    const marker = edge.kind === "mutation" ? "arrow-mutation" : edge.kind === "redirect" ? "arrow-redirect" : "arrow";
    const line = svg("path", { class: "line", d, "marker-end": `url(#${marker})` });
    const hit = svg("path", { class: "hit", d });
    const group = svg("g", { class: `edge ${edge.kind}${edge.node.reachable ? "" : " orphan"}${edge.stub ? " stubbed" : ""}` }, line, hit);
    edge.group = group;
    edge.line = line;
    edge.marker = marker;
    group.addEventListener("mouseenter", (e) => { highlightEdges([edge]); tooltip(e, `${edge.item.vm}.${eventText(edge.row.event)}`); });
    group.addEventListener("mousemove", (e) => tooltip(e));
    group.addEventListener("mouseleave", () => { clearHighlight(); tooltip(null); });
    group.addEventListener("click", () => { if (!moved) focusOn(edge.node.name); });
    edgeLayer.append(group);
    if (edge.stub) {
      const label = `→ ${edge.target.name}`;
      const width = measure(label, "mono") + 12;
      const stub = svg("g", { class: `stub ${edge.kind}` },
        svg("line", { x1, y1, x2: x1 + 14, y2: y1 }),
        svg("rect", { x: x1 + 14, y: y1 - 9, width, height: 18, rx: 9 }),
        svg("text", { x: x1 + 20, y: y1 + 4 }, label));
      edge.stubGroup = stub;
      stub.addEventListener("mouseenter", () => highlightEdges([edge]));
      stub.addEventListener("mouseleave", clearHighlight);
      stub.addEventListener("click", () => { if (!moved) focusOn(edge.target.name); });
      stubLayer.append(stub);
    }
  }

  for (const node of nodes) {
    const group = svg("g", { class: `node${node.reachable ? "" : " orphan"}`, transform: `translate(${node.x},${node.y})` });
    group.append(svg("rect", { class: "box", width: node.width, height: node.height, rx: 8 }));
    group.append(svg("path", { class: "head", d: `M0,8 a8,8 0 0 1 8,-8 h${node.width - 16} a8,8 0 0 1 8,8 v${HEAD - 12} h${-node.width} z` }));
    group.append(svg("text", { class: "title", x: PAD, y: node.route || !node.screen ? 18 : 24 }, node.name));
    if (hubs.has(node)) group.append(svg("text", { class: "incoming", x: node.width - PAD, y: 18, "text-anchor": "end" }, `← ${node.incoming.length}`));
    if (node.route) group.append(svg("text", { class: "route", x: PAD, y: 32 }, node.route));
    else if (!node.screen) group.append(svg("text", { class: "route", x: PAD, y: 32 }, "component · no navigator"));
    for (const row of node.rows) {
      if (row.type === "label") {
        group.append(svg("text", { class: "item-label", x: PAD, y: row.y + 14 }, row.text));
      } else if (row.type === "empty") {
        group.append(svg("text", { class: "empty", x: PAD, y: row.y + 15 }, "no navigation events"));
      } else {
        const indent = row.item.self ? PAD : PAD + 8;
        const rowGroup = svg("g", { class: `event-row ${row.event.kind}` },
          svg("rect", { class: "row-bg", x: 1, y: row.y, width: node.width - 2, height: ROW }),
          svg("text", { class: "event", x: indent, y: row.y + 15 }, eventText(row.event)),
          svg("circle", { class: "port", cx: node.width, cy: row.y + ROW / 2, r: 3 }));
        row.group = rowGroup;
        rowGroup.addEventListener("mouseenter", () => highlightEdges([row.edge]));
        rowGroup.addEventListener("mouseleave", clearHighlight);
        rowGroup.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!moved) focusOn(node.name);
        });
        group.append(rowGroup);
      }
    }
    node.group = group;
    group.addEventListener("mouseenter", () => highlightNode(node));
    group.addEventListener("mouseleave", clearHighlight);
    group.addEventListener("click", () => { if (!moved) focusOn(node.name); });
    nodeLayer.append(group);
  }

  // ---------- highlighting ----------
  const tooltipElement = document.getElementById("tooltip");
  function tooltip(event, text) {
    if (!event) { tooltipElement.style.display = "none"; return; }
    if (text != null) tooltipElement.textContent = text;
    tooltipElement.style.display = "block";
    tooltipElement.style.left = `${event.clientX + 12}px`;
    tooltipElement.style.top = `${event.clientY + 12}px`;
  }
  function highlightEdges(edges) {
    const nodesInvolved = new Set(edges.flatMap((edge) => [edge.node, edge.target]));
    for (const edge of events) {
      if (!edge.group) continue;
      const on = edges.includes(edge);
      edge.group.classList.toggle("hl", on);
      edge.group.classList.toggle("dim", !on);
      edge.line.setAttribute("marker-end", `url(#${on ? "arrow-hl" : edge.marker})`);
      edge.row.group?.classList.toggle("hl", on);
      edge.stubGroup?.classList.toggle("hl", on);
      edge.stubGroup?.classList.toggle("dim", !on);
    }
    for (const node of nodes) {
      node.group.classList.toggle("hl", nodesInvolved.has(node));
      node.group.classList.toggle("dim", !nodesInvolved.has(node));
    }
  }
  function highlightNode(node) {
    highlightEdges(events.filter((edge) => edge.node === node || edge.target === node));
    node.group.classList.remove("dim");
  }
  function clearHighlight() {
    for (const edge of events) {
      if (!edge.group) continue;
      edge.group.classList.remove("hl", "dim");
      edge.line.setAttribute("marker-end", `url(#${edge.marker})`);
      edge.row.group?.classList.remove("hl");
      edge.stubGroup?.classList.remove("hl", "dim");
    }
    for (const node of nodes) node.group.classList.remove("hl", "dim");
    applySearch();
  }

  // ---------- pan and zoom ----------
  const view = { x: 0, y: 0, k: 1 };
  const apply = () => viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
  const zoomAt = (factor, cx, cy) => {
    const k = Math.min(3, Math.max(0.15, view.k * factor));
    view.x = cx - (cx - view.x) * (k / view.k);
    view.y = cy - (cy - view.y) * (k / view.k);
    view.k = k;
    apply();
  };
  function fit() {
    const box = (focusGroup || fullGroup).getBBox(), width = canvas.clientWidth, height = canvas.clientHeight;
    const k = Math.min(1.25, (width - 60) / box.width, (height - 60) / box.height);
    view.k = Math.max(0.15, k);
    view.x = (width - box.width * view.k) / 2 - box.x * view.k;
    view.y = (height - box.height * view.k) / 2 - box.y * view.k;
    apply();
  }
  function center(node) {
    view.x = canvas.clientWidth / 2 - (node.x + node.width / 2) * view.k;
    view.y = canvas.clientHeight / 2 - (node.y + node.height / 2) * view.k;
    apply();
  }
  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    if (event.ctrlKey || event.metaKey || event.deltaMode === 1) {
      zoomAt(Math.exp(-event.deltaY * (event.deltaMode === 1 ? 0.05 : 0.0025)), event.clientX - rect.left, event.clientY - rect.top);
    } else {
      view.x -= event.deltaX;
      view.y -= event.deltaY;
      apply();
    }
  }, { passive: false });
  let drag = null, moved = false;
  const pointers = new Map();
  canvas.addEventListener("pointerdown", (event) => {
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    drag = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y };
    moved = false;
  });
  window.addEventListener("pointermove", (event) => {
    if (!pointers.has(event.pointerId)) return;
    const previous = pointers.get(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const other = [...pointers.entries()].find(([id]) => id !== event.pointerId)[1];
      const before = Math.hypot(previous.x - other.x, previous.y - other.y);
      const after = Math.hypot(a.x - b.x, a.y - b.y);
      const rect = canvas.getBoundingClientRect();
      if (before > 0) zoomAt(after / before, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);
      moved = true;
      return;
    }
    if (!drag) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) canvas.setPointerCapture?.(event.pointerId);
    moved = true;
    canvas.classList.add("dragging");
    view.x = drag.vx + dx;
    view.y = drag.vy + dy;
    apply();
  });
  const release = (event) => {
    pointers.delete(event.pointerId);
    if (pointers.size === 0) { drag = null; canvas.classList.remove("dragging"); }
  };
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  document.getElementById("fit").addEventListener("click", fit);
  const allEdges = document.getElementById("all-edges");
  allEdges.hidden = hubs.size === 0;
  allEdges.addEventListener("click", () => {
    const on = document.body.classList.toggle("show-all");
    allEdges.setAttribute("aria-pressed", String(on));
  });

  // ---------- search ----------
  const search = document.getElementById("search");
  function applySearch() {
    const query = search.value.trim().toLowerCase();
    for (const node of nodes) {
      const match = query !== "" && (node.name.toLowerCase().includes(query) || node.items.some((item) => item.vm.toLowerCase().includes(query)));
      node.group.classList.toggle("match", match);
      if (query !== "" && !match) node.group.classList.add("dim");
    }
    if (query !== "") for (const edge of events) { edge.group?.classList.add("dim"); edge.stubGroup?.classList.add("dim"); }
  }
  search.addEventListener("input", () => { clearHighlight(); });
  search.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const query = search.value.trim().toLowerCase();
    const node = nodes.find((n) => n.name.toLowerCase().includes(query));
    if (node) focusOn(node.name);
  });

  // ---------- focus view ----------
  // Clicking a box redraws the graph around it: the screens that open it on the left, each with only the
  // rows that do; the box itself in the middle with all its events; the screens it opens on the right.
  let focused = null, focusGroup = null, savedView = null;
  const focusBar = document.getElementById("focus-bar");
  const subtitleOf = (node) => node.route || (node.screen ? null : "component · no navigator");

  function layoutBox(spec) {
    let y = HEAD;
    let width = Math.max(measure(spec.name, "title") + 2 * PAD + 20, MIN_WIDTH);
    if (spec.subtitle) width = Math.max(width, measure(spec.subtitle, "label") + 2 * PAD);
    const rows = spec.rows.map((row) => {
      const placed = { ...row, y };
      if (row.type === "label") {
        width = Math.max(width, measure(row.text, "label") + 2 * PAD);
        y += LABEL;
      } else {
        width = Math.max(width, measure(eventText(row.event), "mono") + 2 * PAD + 14);
        y += ROW;
      }
      return placed;
    });
    if (spec.emptyText) { rows.push({ type: "empty", y }); y += ROW; }
    return { ...spec, rows, width: Math.ceil(width), height: rows.length ? y + 8 : HEAD + 4 };
  }

  function drawBox(box, extraClass) {
    const group = svg("g", { class: `node ${extraClass}${box.node.reachable ? "" : " orphan"}`, transform: `translate(${box.x},${box.y})` });
    group.append(svg("rect", { class: "box", width: box.width, height: box.height, rx: 8 }));
    group.append(svg("path", { class: "head", d: `M0,8 a8,8 0 0 1 8,-8 h${box.width - 16} a8,8 0 0 1 8,8 v${HEAD - 12} h${-box.width} z` }));
    group.append(svg("text", { class: "title", x: PAD, y: box.subtitle ? 18 : 24 }, box.name));
    if (box.subtitle) group.append(svg("text", { class: "route", x: PAD, y: 32 }, box.subtitle));
    for (const row of box.rows) {
      if (row.type === "label") {
        group.append(svg("text", { class: "item-label", x: PAD, y: row.y + 14 }, row.text));
      } else if (row.type === "empty") {
        group.append(svg("text", { class: "empty", x: PAD, y: row.y + 15 }, box.emptyText));
      } else {
        row.group = svg("g", { class: `event-row ${row.event.kind}` },
          svg("rect", { class: "row-bg", x: 1, y: row.y, width: box.width - 2, height: ROW }),
          svg("text", { class: "event", x: row.indent ? PAD + 8 : PAD, y: row.y + 15 }, eventText(row.event)),
          svg("circle", { class: "port", cx: box.width, cy: row.y + ROW / 2, r: 3 }));
        group.append(row.group);
      }
    }
    return group;
  }

  /** The rows of [node] for the given edges, under their item labels, in the node's order. */
  function rowsFor(node, edges) {
    const rows = [];
    for (const item of node.items) {
      const itemEdges = edges.filter((edge) => edge.node === node && edge.item === item);
      if (!itemEdges.length) continue;
      if (!item.self) rows.push({ type: "label", text: item.vm });
      for (const edge of itemEdges) rows.push({ type: "event", event: edge.row.event, edge, indent: !item.self });
    }
    return rows;
  }

  function renderFocus(node) {
    focusGroup?.remove();
    const incoming = events.filter((edge) => edge.target === node && edge.node !== node);
    const outgoing = events.filter((edge) => edge.node === node);
    const sources = [...new Set(incoming.map((edge) => edge.node))];
    const destinations = [...new Set(outgoing.filter((edge) => edge.target && edge.target !== node).map((edge) => edge.target))];

    const sourceBoxes = sources.map((source) =>
      layoutBox({ name: source.name, subtitle: subtitleOf(source), node: source, rows: rowsFor(source, incoming) }));
    const focusRows = rowsFor(node, outgoing);
    const focusBox = layoutBox({
      name: node.name, subtitle: subtitleOf(node), node, rows: focusRows,
      emptyText: focusRows.length ? null : "no navigation events",
    });
    // Destinations in the order of the rows that open them (their average position), to limit crossings.
    const eventRows = focusBox.rows.filter((row) => row.type === "event");
    const rank = (target) => {
      const indexes = eventRows.map((row, i) => (row.edge.target === target ? i : -1)).filter((i) => i >= 0);
      return indexes.reduce((sum, i) => sum + i, 0) / indexes.length;
    };
    destinations.sort((a, b) => rank(a) - rank(b));
    const destinationBoxes = destinations.map((target) => layoutBox({ name: target.name, subtitle: subtitleOf(target), node: target, rows: [] }));

    // Three columns, each centred on the focus box.
    const columns = [sourceBoxes, [focusBox], destinationBoxes];
    let x = 0;
    for (const column of columns) {
      const width = Math.max(0, ...column.map((box) => box.width));
      const height = column.reduce((sum, box) => sum + box.height, 0) + GAP_Y * Math.max(0, column.length - 1);
      let y = -height / 2;
      for (const box of column) {
        box.x = x + (width - box.width) / 2;
        box.y = y;
        y += box.height + GAP_Y;
      }
      if (column.length) x += width + GAP_X + 40;
    }

    const group = svg("g");
    const edgeGroup = svg("g"), boxGroup = svg("g");
    group.append(edgeGroup, boxGroup);
    const label = (text, column) => {
      if (!column.length) return;
      const left = Math.min(...column.map((box) => box.x));
      const top = Math.min(...column.map((box) => box.y));
      boxGroup.append(svg("text", { class: "column-label", x: left, y: top - 14 }, text));
    };
    label(`Opened from (${sourceBoxes.length})`, sourceBoxes);
    label(`Opens (${destinationBoxes.length})`, destinationBoxes);

    const lines = new Map();
    const drawEdge = (row, d, from) => {
      const marker = row.event.kind === "mutation" ? "arrow-mutation" : row.event.kind === "redirect" ? "arrow-redirect" : "arrow";
      const line = svg("path", { class: "line", d, "marker-end": `url(#${marker})` });
      const edgeElement = svg("g", { class: `edge ${row.event.kind}${from.node.reachable ? "" : " orphan"}` }, line, svg("path", { class: "hit", d }));
      const on = (state) => {
        edgeElement.classList.toggle("hl", state);
        line.setAttribute("marker-end", `url(#${state ? "arrow-hl" : marker})`);
        row.group?.classList.toggle("hl", state);
      };
      lines.set(row, on);
      edgeElement.addEventListener("mouseenter", (e) => { on(true); tooltip(e, `${row.edge.item.vm}.${eventText(row.event)}`); });
      edgeElement.addEventListener("mousemove", (e) => tooltip(e));
      edgeElement.addEventListener("mouseleave", () => { on(false); tooltip(null); });
      edgeGroup.append(edgeElement);
    };
    const curve = (x1, y1, x2, y2) => {
      const dx = Math.max(40, (x2 - x1) / 2);
      return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    };

    // Into the focus box: entry points spread down its left side in source order.
    const entering = sourceBoxes.flatMap((box) => box.rows.filter((row) => row.type === "event").map((row) => ({ box, row })));
    entering.forEach(({ box, row }, i) => {
      const y2 = focusBox.y + 14 + Math.max(focusBox.height - 28, 1) * (i + 0.5) / entering.length;
      drawEdge(row, curve(box.x + box.width, box.y + row.y + ROW / 2, focusBox.x, y2), box);
    });
    // Out of the focus box: to the destination's left side, spread when several events open it.
    const byTarget = new Map(destinationBoxes.map((box) => [box.node, box]));
    const leaving = focusBox.rows.filter((row) => row.type === "event");
    for (const row of leaving) {
      const x1 = focusBox.x + focusBox.width, y1 = focusBox.y + row.y + ROW / 2;
      const target = row.edge.target;
      if (target === node) {
        const below = focusBox.y + focusBox.height + 24;
        drawEdge(row, rounded([[x1, y1], [x1 + 28, y1], [x1 + 28, below], [focusBox.x - 28, below], [focusBox.x - 28, focusBox.y + 20], [focusBox.x, focusBox.y + 20]]), focusBox);
        continue;
      }
      const box = byTarget.get(target);
      if (!box) continue;
      const into = leaving.filter((other) => other.edge.target === target);
      const y2 = box.y + 10 + (box.height - 20) * (into.indexOf(row) + 0.5) / into.length;
      drawEdge(row, curve(x1, y1, box.x, y2), focusBox);
    }

    const place = (box, extraClass, onClick) => {
      const element = drawBox(box, extraClass);
      for (const row of box.rows) {
        if (row.type !== "event" || !row.group) continue;
        row.group.addEventListener("mouseenter", () => lines.get(row)?.(true));
        row.group.addEventListener("mouseleave", () => lines.get(row)?.(false));
      }
      element.addEventListener("click", () => { if (!moved) onClick(); });
      boxGroup.append(element);
    };
    for (const box of sourceBoxes) place(box, "", () => focusOn(box.node.name));
    place(focusBox, "focus", () => openModal(node.name));
    for (const box of destinationBoxes) place(box, "", () => focusOn(box.node.name));
    // A row in the focus box opens the screen it navigates to.
    for (const row of leaving) {
      row.group?.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!moved && row.edge.target) focusOn(row.edge.target.name);
      });
    }

    focusGroup = group;
    viewport.append(group);
    fullGroup.style.display = "none";
    focusBar.hidden = false;
    allEdges.hidden = true;
    document.getElementById("focus-label").replaceChildren(
      el("b", {}, node.name), ` · opened from ${sources.length} · opens ${destinations.length}`);
    fit();
  }

  function focusOn(name, push = true) {
    const node = byName.get(name);
    if (!node) return;
    if (!focused) savedView = { ...view };
    focused = node;
    if (push) window.history.pushState(null, "", `#focus=${encodeURIComponent(name)}`);
    renderFocus(node);
  }

  function resetView(push = true) {
    if (!focused) return;
    focused = null;
    focusGroup?.remove();
    focusGroup = null;
    fullGroup.style.display = "";
    focusBar.hidden = true;
    allEdges.hidden = hubs.size === 0;
    if (savedView) { Object.assign(view, savedView); apply(); }
    if (push) window.history.pushState(null, "", location.pathname + location.search);
  }

  document.getElementById("reset-view").addEventListener("click", () => resetView());
  document.getElementById("details").addEventListener("click", () => { if (focused) openModal(focused.name); });
  window.addEventListener("popstate", () => {
    const name = new URLSearchParams(location.hash.slice(1)).get("focus");
    if (name) focusOn(name, false);
    else resetView(false);
  });

  // ---------- modal ----------
  const backdrop = document.getElementById("backdrop");
  const body = document.getElementById("modal-body");
  const modalHistory = [];
  let current = null;

  const sourceLink = (link) => link ? el("a", { class: "src", href: link.href, title: link.href }, link.label) : null;
  const navChips = (targets) => targets.map((target) =>
    el("button", { class: "chip nav", title: `Open ${target}`, onclick: () => openModal(target) }, target));

  // A type string with an expandable block for every catalog type it names.
  // State types start expanded one level, so the full state is visible without clicking.
  function typeView(type, seen = [], expanded = false) {
    const wrapper = el("div", {}, el("code", {}, type));
    const names = [...new Set(type.match(/[A-Za-z_][A-Za-z0-9_.]*/g) || [])].filter((name) => data.types[name]);
    for (const name of names) wrapper.append(typeDetails(name, seen, expanded));
    return wrapper;
  }
  function typeDetails(name, seen, expanded = false) {
    const type = data.types[name];
    const details = el("details", { class: "type" }, el("summary", {}, name));
    if (seen.includes(name)) {
      details.append(el("div", { class: "muted" }, "(already expanded above)"));
      return details;
    }
    details.addEventListener("toggle", () => {
      if (!details.open || details.dataset.filled) return;
      details.dataset.filled = "1";
      const content = el("div");
      const link = sourceLink(type.link);
      if (link) content.append(el("div", {}, link));
      if (type.external) content.append(el("div", { class: "muted" }, "external: ", el("code", {}, type.external)));
      if (type.enum) content.append(el("div", {}, "enum ", type.enum.map((c) => el("span", { class: "chip" }, c))));
      if (type.subtypes) {
        content.append(el("div", {}, "subtypes ", type.subtypes.map((s) => el("span", { class: "chip" }, s))));
        for (const subtype of type.subtypes) if (data.types[subtype]) content.append(typeDetails(subtype, [...seen, name]));
      }
      if (type.fields && type.fields.length) {
        content.append(el("table", {}, type.fields.map((field) =>
          el("tr", {}, el("td", { class: "name" }, field.name), el("td", {}, typeView(field.type, [...seen, name]))))));
      } else if (type.fields) {
        content.append(el("div", { class: "muted" }, "no fields"));
      }
      details.append(content);
    });
    if (expanded) details.open = true;
    return details;
  }

  function section(title, content) {
    if (!content || (Array.isArray(content) && !content.length)) return null;
    return el("section", {}, el("h3", {}, title), content);
  }
  const table = (rows) => rows.length ? el("table", {}, rows) : null;

  function vmView(vm, depth) {
    const parts = [];
    const navigation = vm.navigation;
    if (navigation) {
      parts.push(section("Navigation", el("div", {},
        el("div", { class: "kv" },
          el("span", {}, "Route"), navigation.route ? el("code", {}, navigation.route) : el("span", { class: "muted" }, "not deep-linkable"),
          navigation.routeAliases.length ? el("span", {}, "Route aliases") : null,
          navigation.routeAliases.length ? el("code", {}, navigation.routeAliases.join(", ")) : null,
          el("span", {}, "Route args"), navigation.routeArgs.length ? el("code", {}, navigation.routeArgs.join(", ")) : el("span", { class: "muted" }, "none"),
          el("span", {}, "Response"), navigation.response ? typeView(navigation.response) : el("span", { class: "muted" }, "none"),
          navigation.redirectsTo.length ? el("span", {}, "Redirects to") : null,
          navigation.redirectsTo.length ? el("span", {}, navChips(navigation.redirectsTo), " ", sourceLink(navigation.redirectsLink)) : null),
        table(navigation.args.map((arg) => el("tr", {},
          el("td", { class: "name" }, arg.name), el("td", {}, typeView(arg.type)), el("td", { class: "src" }, sourceLink(arg.link))))))));
    }
    if (!vm.screen && depth === 0 && vm.embeddedBy.length) {
      parts.push(section("Embedded by", el("div", {}, navChips(vm.embeddedBy))));
    }
    if (vm.identity) {
      parts.push(section("Identity", table([el("tr", {}, el("td", { class: "name" }, vm.identity.name), el("td", {}, el("code", {}, "String")), el("td", { class: "src" }, sourceLink(vm.identity.link)))])));
    }
    parts.push(section("State", table(vm.state.map((field) => el("tr", {},
      el("td", { class: "name" }, field.name), el("td", {}, typeView(field.type, [], true)), el("td", { class: "src" }, sourceLink(field.link)))))));
    parts.push(section("Actions", table(vm.actions.map((action) => el("tr", {},
      el("td", { class: "name" }, `${action.name}()`), el("td", {}, navChips(action.navigatesTo)), el("td", { class: "src" }, sourceLink(action.link)))))));
    parts.push(section("Mutations", table(vm.mutations.map((mutation) => el("tr", {},
      el("td", { class: "name" }, `${mutation.name}(${mutation.param.name}: ${mutation.param.type})`),
      el("td", {},
        mutation.binds ? el("div", { class: "muted" }, "binds ", el("code", {}, mutation.binds)) : null,
        navChips(mutation.navigatesTo)),
      el("td", { class: "src" }, sourceLink(mutation.link)))))));
    parts.push(section("Lists", vm.lists.map((list) => el("div", {},
      el("div", { class: "kv" },
        el("span", {}, "List"), el("span", {}, el("code", {}, list.name), " ", el("span", { class: "badge" }, list.kind), " ", sourceLink(list.link)),
        list.sections.length ? el("span", {}, "Sections") : null, list.sections.length ? el("span", {}, list.sections.map((s) => el("span", { class: "chip" }, s))) : null,
        el("span", {}, "Element"), el("code", {}, list.element)),
      list.rows.map((row) => componentDetails(row, depth))))));
    parts.push(section("Children", vm.children.map((child) => componentDetails(child.type, depth, child.name, child.link))));
    const filled = parts.filter(Boolean);
    return filled.length ? filled : [el("p", { class: "muted" }, "No state, actions, mutations, lists or children.")];
  }

  function componentDetails(name, depth, property, link) {
    const vm = data.vms[name];
    const summary = el("summary", {}, property ? `${property}: ${name}` : name, " ",
      vm ? sourceLink(link || vm.link) : null);
    const details = el("details", { class: "vm", "data-vm": name }, summary);
    if (!vm) return details;
    details.addEventListener("toggle", () => {
      if (!details.open || details.dataset.filled) return;
      details.dataset.filled = "1";
      details.append(el("div", {}, vmView(vm, depth + 1)));
    });
    return details;
  }

  function openModal(name, focus = null, push = true) {
    const vm = data.vms[name];
    if (!vm) return;
    if (push && current && current !== name) modalHistory.push(current);
    current = name;
    document.getElementById("modal-title").textContent = vm.name;
    document.getElementById("modal-title").append(" ", el("span", { class: `badge${vm.screen ? " screen" : ""}` }, vm.screen ? "screen" : "component"));
    document.getElementById("modal-spec").textContent = vm.spec;
    const link = document.getElementById("modal-link");
    link.replaceChildren(sourceLink(vm.link) || "");
    document.getElementById("modal-back").hidden = modalHistory.length === 0;
    body.replaceChildren(...vmView(vm, 0));
    backdrop.classList.add("open");
    body.scrollTop = 0;
    if (focus) {
      const target = body.querySelector(`details.vm[data-vm="${CSS.escape(focus)}"]`);
      if (target) {
        target.open = true;
        target.dispatchEvent(new Event("toggle"));
        target.scrollIntoView({ block: "center" });
        target.classList.add("flash");
      }
    }
  }
  function closeModal() {
    backdrop.classList.remove("open");
    modalHistory.length = 0;
    current = null;
  }
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-back").addEventListener("click", () => {
    const previous = modalHistory.pop();
    if (previous) openModal(previous, null, false);
  });
  backdrop.addEventListener("click", (event) => { if (event.target === backdrop) closeModal(); });
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && backdrop.classList.contains("open")) closeModal();
    else if (event.key === "Escape" && focused) resetView();
    else if (event.key === "/" && document.activeElement !== search) { event.preventDefault(); search.focus(); }
  });

  fit();
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("focus")) focusOn(params.get("focus"), false);
  if (params.get("screen")) openModal(params.get("screen"));
})();
</script>
</body>
</html>
