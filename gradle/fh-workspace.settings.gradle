// Shared by Fullhouse and its libraries. No effect in released mode.
// Workspace manifests are generated by fh deps resolve/publish, never checked in.
import groovy.json.JsonSlurper

def manifestPath = providers.gradleProperty('fhWorkspace').orNull
if (manifestPath) {
    def manifest = new JsonSlurper().parse(new File(manifestPath))
    if (manifest.schema != 1 || !manifest.repository || !manifest.groups) throw new GradleException('Invalid fh workspace manifest')
    def repo = new File(manifest.repository)
    def overrides = manifest.groups.collectEntries { k, v -> [(k): v.version] }
    def configureRepos = { handler ->
        handler.maven { name = 'fhWorkspace'; url = repo.toURI(); content { descriptor -> overrides.keySet().each { descriptor.includeGroup(it) } } }
        handler.all { repository ->
            if (repository.name != 'fhWorkspace') repository.content { descriptor -> overrides.keySet().each { descriptor.excludeGroup(it) } }
        }
    }
    dependencyResolutionManagement.repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_SETTINGS)
    configureRepos(dependencyResolutionManagement.repositories)
    configureRepos(pluginManagement.repositories)
    pluginManagement.resolutionStrategy.eachPlugin {
        def version = overrides[requested.id.id]
        if (version) useVersion(version)
    }
    gradle.beforeProject { p ->
        // Also cover repositories declared by legacy builds and buildscript classpaths.
        // Project dependencies use settings repositories in workspace mode.
        configureRepos(p.buildscript.repositories)
        [p.configurations, p.buildscript.configurations].each { configs ->
            configs.configureEach { c ->
                c.resolutionStrategy.eachDependency { d ->
                    // Rewriting a same-build project selector with useVersion turns it into an
                    // external module and makes first publication depend on itself. Direct external
                    // declarations are constrained below; keep local project edges intact.
                    if (overrides[d.requested.group] && d.requested.group != p.group.toString()) {
                        d.useVersion(overrides[d.requested.group])
                    }
                }
                c.dependencies.all { d ->
                    if (d instanceof org.gradle.api.artifacts.ExternalModuleDependency && overrides[d.group]) {
                        d.version { strictly(overrides[d.group]) }
                    }
                }
            }
        }
        p.afterEvaluate {
            def effective = overrides[p.group.toString()]
            if (effective) p.version = effective
            p.plugins.withId('maven-publish') {
                p.publishing.publications.withType(org.gradle.api.publish.maven.MavenPublication).configureEach { pub ->
                    def v = overrides[pub.groupId]
                    if (v) pub.version = v
                }
            }
        }
        // The CLI publishes only to its isolated maven.repo.local; signing is unnecessary.
        if (providers.gradleProperty('fhLocalPublish').orNull == 'true') {
            p.tasks.withType(org.gradle.plugins.signing.Sign).configureEach { enabled = false }
        }
    }
}

// Capture artifacts actually resolved, including snapshot bytes. fh passes the output path.
def reportPath = providers.gradleProperty('fhResolutionReport').orNull
if (reportPath) {
    // Observe resolution, but defer artifact reads until task execution has finished.
    // Eager resolvedConfiguration access inside afterResolve changes Android variant selection.
    def resolved = java.util.Collections.synchronizedSet(new LinkedHashSet())
    gradle.beforeProject { p ->
        p.configurations.configureEach { configuration ->
            configuration.incoming.afterResolve { resolved.add(configuration) }
        }
    }
    gradle.buildFinished {
        def artifacts = new TreeMap()
        def failures = []
        resolved.toList().each { configuration ->
            try {
                def view = configuration.incoming.artifactView {
                    lenient true
                    componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                }.artifacts
                view.artifacts.each { a ->
                    def component = a.id.componentIdentifier
                    if (component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(a.file.bytes).encodeHex().toString()
                        def coordinate = "${component.group}:${component.module}:${component.version}".toString()
                        artifacts[coordinate + ':' + a.file.name] = [coordinate: coordinate, file: a.file.name, checksum: sha]
                    }
                }
                view.failures.each { failures.add([configuration: configuration.name, error: it.message]) }
            } catch (Exception e) {
                failures.add([configuration: configuration.name, error: e.message])
            }
        }
        def output = new File(reportPath)
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([schema: 1, artifacts: artifacts.values().toList(), failures: failures]))
    }
}
