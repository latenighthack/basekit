[versions]
kotlin = "2.3.10"
agp = "8.13.2"
coroutines = "1.9.0"
skie = "0.10.14"
# KSP release aligned to Kotlin 2.3.10 (unified versioning tracks the Kotlin version).
ksp = "2.3.10"
maven-publish = "0.30.0"
# kotlin-inject wires the generated TUI component (the `tui` slice).
kotlin-inject = "0.7.1"
# TamboUI: the JVM terminal-UI toolkit the `tui` slice renders with. Snapshot-only for now.
tamboui = "0.5.0-SNAPSHOT"
# deltalist supplies the list system (Flow<Delta<T>>) and its platform bindings. Resolved from the
# ../../deltalist composite build, so the version is nominal (Gradle substitutes by group:module).
deltalist = "0.2.0"
androidx-recyclerview = "1.3.2"
androidx-activity = "1.9.3"
androidx-lifecycle = "2.8.7"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Virtual-time test scheduler (runTest) for the navigation-test slice's own suite. Test-only.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# KSP processor authoring
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# kotlin-inject (declared for a future DI slice; not yet consumed)
kotlin-inject-runtime = { module = "me.tatarka.inject:kotlin-inject-runtime", version.ref = "kotlin-inject" }
kotlin-inject-ksp = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlin-inject" }

# TamboUI terminal-UI toolkit + a runtime backend (the `tui` slice renders JVM screens with these)
tamboui-toolkit = { module = "dev.tamboui:tamboui-toolkit", version.ref = "tamboui" }
tamboui-jline3-backend = { module = "dev.tamboui:tamboui-jline3-backend", version.ref = "tamboui" }

# deltalist list system (consumed from the ../../deltalist composite build)
deltalist-core = { module = "com.latenighthack.deltalist:deltalist-core", version.ref = "deltalist" }
deltalist-android-recyclerview = { module = "com.latenighthack.deltalist:deltalist-android-recyclerview", version.ref = "deltalist" }
deltalist-react = { module = "com.latenighthack.deltalist:deltalist-react", version.ref = "deltalist" }

# androidx (viewmodel runtime RecyclerView binding)
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# Gradle plugin artifacts referenced from build-logic so the convention plugins can apply them by id.
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
plugin-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
