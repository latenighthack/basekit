name: Secrets probe

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which publish secrets are visible (presence only)
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          P: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          K: ${{ secrets.SIGNING_KEY }}
          S: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for v in U P K S; do
            if [ -n "${!v}" ]; then echo "$v: present"; else echo "$v: EMPTY"; fi
          done
