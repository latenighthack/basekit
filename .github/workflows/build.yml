name: Build

# There was no PR-time build before this: release.yml only fires on a v* tag, so a broken target
# first surfaced during a release. That matters most for the Apple codegen, which fails *silently* —
# the ViewModel processor picks its generator from the KSP output path, so a target it doesn't
# recognise emits no Swift at all and the build still succeeds. The generated-Swift steps below are
# what turn that into a red build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: All targets + Apple frameworks + generated-Swift typecheck
    # macOS is required so the Kotlin/Native Apple targets + SKIE compile; an ubuntu run would
    # silently skip them. Matches release.yml.
    runs-on: macos-14
    env:
      # Match the macOS 15 / iOS 18 deployment targets and Swift 6 consumer checks.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      # Keep the oldest CI compiler covered even if the runner's default Xcode changes.
      - name: Typecheck Swift runtime with Xcode 15.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: >
          xcrun swiftc -typecheck -swift-version 5 -warnings-as-errors
          basekit-viewmodel/src/commonMain/swift/KvoViewModel.swift

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify published plugin coordinates and consumer wiring
        run: python3 scripts/verify-plugin-release.py

      - name: Build and test all targets
        run: ./gradlew build --stacktrace

      # Explicitly cover the frameworks whose bundled Swift and generated consumers are checked below.
      - name: Link debug frameworks (compiles the bundled Swift)
        run: >
          ./gradlew --stacktrace
          :basekit-navigation:linkDebugFrameworkMacosArm64
          :basekit-navigation:linkDebugFrameworkIosArm64
          :basekit-viewmodel:linkDebugFrameworkMacosArm64
          :basekit-viewmodel:linkDebugFrameworkIosArm64
          :demo-core:linkDebugFrameworkMacosArm64
          :demo-core:linkDebugFrameworkIosSimulatorArm64

      # Also runs verifyBasekitViewModelSwiftIsUniversal, which fails if any two Apple passes emit
      # the same Swift file name with different bytes (the flatten below keeps only one copy, in
      # unspecified walk order).
      - name: Collect generated Swift and verify it is universal
        run: ./gradlew :demo-core:collectBasekitAppleSwift --stacktrace

      - name: Fail if the Apple passes emitted no Swift
        run: |
          count=$(ls demo-core/build/generated/basekit-apple/swift/*.swift 2>/dev/null | wc -l)
          echo "collected $count generated Swift files"
          if [ "$count" -eq 0 ]; then
            echo "::error::No Swift was generated - the Basekit processors did not recognise the Apple KSP passes"
            exit 1
          fi

      - name: Typecheck generated Swift against the macOS framework
        run: |
          xcrun swiftc -typecheck \
            -swift-version 6 \
            -target arm64-apple-macos15.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -F demo-core/build/bin/macosArm64/debugFramework \
            demo-core/build/generated/basekit-apple/swift/*.swift \
            demo-core/src/appleTest/swift/AppleNavigationFixture.swift

      - name: Typecheck generated Swift against the iOS-simulator framework
        run: |
          xcrun swiftc -typecheck \
            -swift-version 6 \
            -target arm64-apple-ios18.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -F demo-core/build/bin/iosSimulatorArm64/debugFramework \
            demo-core/build/generated/basekit-apple/swift/*.swift \
            demo-core/src/appleTest/swift/AppleNavigationFixture.swift

      - name: Verify iOS framework deployment minimum
        run: |
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' demo-core/build/bin/iosSimulatorArm64/debugFramework/DemoCore.framework/Info.plist)
          test "$minimum" = "18.0"

      - name: Assemble XCFrameworks
        run: >
          ./gradlew --stacktrace
          :basekit-navigation:assembleBasekitNavigationDebugXCFramework
          :basekit-viewmodel:assembleBasekitViewModelDebugXCFramework
          :demo-core:assembleDemoCoreDebugXCFramework

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload Swift compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-compiler-diagnostics
          path: '**/build/skie/**/debug/logs/**'
          if-no-files-found: ignore
