name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    # macOS is required so the KMP iOS targets + SKIE compile — an ubuntu run would silently
    # skip them and publish an incomplete artifact set.
    runs-on: macos-26
    env:
      # Match the validated Apple build toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          echo "Tag version:     $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME $PROJECT_VERSION in gradle.properties"
            exit 1
          fi

      - name: Validate plugin publication before releasing anything
        run: python3 scripts/verify-plugin-release.py

      # Every basekit module is released to Central, including the whole `tui` slice. basekit-tui
      # declares the snapshot-only TamboUI as `compileOnly`, so it never reaches the published POM
      # (Central rejects SNAPSHOT deps) — consumers supply TamboUI themselves. `demo-*` are not
      # published. deltalist resolves from Central (see settings.gradle.kts) — publish it first.
      - name: Publish and release
        run: >
          ./gradlew --no-configuration-cache --stacktrace
          :basekit-annotations:publishAndReleaseToMavenCentral
          :basekit-navigation:publishAndReleaseToMavenCentral
          :basekit-navigation-test:publishAndReleaseToMavenCentral
          :basekit-navigation-metrics:publishAndReleaseToMavenCentral
          :basekit-navigation-posthog:publishAndReleaseToMavenCentral
          :basekit-ksp:publishAndReleaseToMavenCentral
          :basekit-viewmodel-annotations:publishAndReleaseToMavenCentral
          :basekit-viewmodel:publishAndReleaseToMavenCentral
          :basekit-viewmodel-compose:publishAndReleaseToMavenCentral
          :basekit-viewmodel-ksp:publishAndReleaseToMavenCentral
          :basekit-tui-annotations:publishAndReleaseToMavenCentral
          :basekit-tui:publishAndReleaseToMavenCentral
          :basekit-tui-ksp:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # The consumer convention plugins are a separate (included) build, so they publish via their own
      # invocation. This releases the plugin jar plus one signed marker artifact per plugin id.
      - name: Publish and release the Gradle plugin
        run: >
          ./gradlew --no-configuration-cache --stacktrace
          -p basekit-gradle-plugin
          publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Package JavaScript PostHog integration
        run: ./gradlew :basekit-navigation-posthog:collectBasekitPostHogJavaScript

      - name: Upload JavaScript PostHog package
        uses: actions/upload-artifact@v4
        with:
          name: basekit-navigation-posthog-js
          path: basekit-navigation-posthog/build/generated/basekit-posthog-js

      # A successful upload is not proof that Central serves the expected coordinates. Wait for
      # propagation, then resolve all markers and processor jars from an external consumer.
      - name: Verify release is available to consumers
        timeout-minutes: 25
        run: >
          python3 scripts/verify-plugin-release.py
          --repository https://repo.maven.apache.org/maven2
          --wait-seconds 1200
